<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>不准動！小強大作戰</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- 引入 MQTT.js -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        body { touch-action: none; overflow: hidden; user-select: none; -webkit-user-select: none; background-color: #111; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .scene-hidden { display: none !important; }
        .shake-effect { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake { 10%, 90% { transform: translate3d(-2px, 0, 0); } 20%, 80% { transform: translate3d(4px, 0, 0); } 30%, 50%, 70% { transform: translate3d(-8px, 0, 0); } 40%, 60% { transform: translate3d(8px, 0, 0); } }
        .damage-text { animation: floatUp 0.8s ease-out forwards; position: absolute; pointer-events: none; z-index: 50; }
        @keyframes floatUp { 0% { opacity: 1; transform: translateY(0) scale(1); } 100% { opacity: 0; transform: translateY(-40px) scale(1.5); } }
        .combo-text { animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes popIn { 0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); } 50% { opacity: 1; transform: translate(-50%, -50%) scale(1.2); } 100% { opacity: 0; transform: translate(-50%, -50%) scale(1.5); } }
        .level-up-banner { animation: slideDownUp 3s ease-in-out forwards; }
        @keyframes slideDownUp { 0% { transform: translate(-50%, -100%); opacity: 0; } 10% { transform: translate(-50%, 20px); opacity: 1; } 90% { transform: translate(-50%, 20px); opacity: 1; } 100% { transform: translate(-50%, -100%); opacity: 0; } }
        #night-overlay { pointer-events: none; transition: opacity 2s ease-in-out; mix-blend-mode: multiply; }
        .shield-pulse { animation: pulseShield 1.5s infinite alternate; }
        @keyframes pulseShield { 0% { opacity: 0.4; transform: scale(1); } 100% { opacity: 0.8; transform: scale(1.05); } }
        
        /* 武器與光暈效果 */
        .weapon-glow { filter: drop-shadow(0 0 8px currentColor); }
        .cooldown-overlay { transition: height 0.1s linear; }
        
        /* 復古掃描線 */
        .scanlines::before { content: " "; display: block; position: absolute; top: 0; left: 0; bottom: 0; right: 0; background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06)); z-index: 100; background-size: 100% 4px, 6px 100%; pointer-events: none; }
        
        #pvp-blind-overlay { transition: opacity 0.5s; pointer-events: none; }
    </style>
</head>
<body class="text-white h-screen w-screen relative overflow-hidden bg-zinc-900">

    <!-- 全局音效控制 -->
    <button id="btn-mute" class="absolute top-4 right-4 z-50 bg-zinc-800/80 p-3 rounded-full text-white shadow-lg active:scale-95 transition">
        <i id="icon-mute" class="fa-solid fa-volume-xmark"></i>
    </button>

    <!-- ================= 大廳介面 ================= -->
    <div id="lobby-screen" class="absolute inset-0 z-40 flex flex-col items-center justify-center scanlines bg-zinc-900">
        <!-- 動態 Canvas 背景 -->
        <canvas id="lobby-canvas" class="absolute inset-0 z-0 opacity-40"></canvas>
        
        <div class="relative z-10 flex flex-col items-center w-full max-w-md px-6">
            <!-- 標題與玩家資訊 -->
            <div class="mb-8 text-center">
                <h1 class="text-4xl sm:text-5xl font-black text-transparent bg-clip-text bg-gradient-to-br from-yellow-400 to-orange-600 drop-shadow-[0_0_15px_rgba(251,191,36,0.5)] mb-2 tracking-wider">小強大作戰</h1>
                
                <div class="bg-zinc-800/80 rounded-2xl p-4 shadow-xl border border-zinc-700 w-full mt-4 backdrop-blur-sm">
                    <div class="flex justify-between items-end mb-2">
                        <div class="flex flex-col items-start">
                            <span class="text-xs text-gray-400 font-bold mb-1">大師等級</span>
                            <span class="text-2xl font-black text-white" id="lobby-level">Lv.1</span>
                        </div>
                        <div class="flex flex-col items-end">
                            <span class="text-[10px] text-gray-400 font-bold mb-1 uppercase tracking-widest">稱號</span>
                            <span class="text-sm font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-purple-400" id="lobby-title">見習生</span>
                        </div>
                    </div>
                    <!-- 經驗條 -->
                    <div class="w-full bg-zinc-900 rounded-full h-3 mb-1 overflow-hidden relative">
                        <div id="lobby-exp-bar" class="bg-gradient-to-r from-blue-500 to-cyan-400 h-3 rounded-full transition-all duration-500" style="width: 0%"></div>
                    </div>
                    <div class="text-right text-[10px] text-gray-500 font-mono"><span id="lobby-exp-text">0/100</span> EXP</div>
                    
                    <div class="mt-4 flex justify-between items-center bg-zinc-900/50 p-2 rounded-lg border border-yellow-900/30">
                        <div class="flex items-center gap-2">
                            <i class="fa-solid fa-coins text-yellow-400"></i>
                            <span class="text-lg font-mono font-bold text-yellow-400" id="lobby-coins">0</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 模式按鈕 -->
            <div class="w-full grid grid-cols-1 gap-3">
                <button onclick="openPvPModal()" class="group relative overflow-hidden bg-gradient-to-r from-purple-600 to-indigo-600 p-4 rounded-2xl font-bold text-lg shadow-[0_0_20px_rgba(124,58,237,0.4)] active:scale-95 transition border border-purple-400/50">
                    <div class="absolute inset-0 bg-white/20 transform -skew-x-12 -translate-x-full group-hover:translate-x-full transition-transform duration-500"></div>
                    <i class="fa-solid fa-wifi mr-2 animate-pulse"></i> 1對1 連線對戰
                </button>
                <button onclick="openSceneSelect('battle')" class="bg-zinc-800 hover:bg-zinc-700 p-4 rounded-2xl font-bold text-lg shadow-lg active:scale-95 transition border border-zinc-600 text-red-400">
                    <i class="fa-solid fa-shield-halved mr-2"></i> 挑戰模式 (保衛戰)
                </button>
                <button onclick="openSceneSelect('sandbox')" class="bg-zinc-800 hover:bg-zinc-700 p-4 rounded-2xl font-bold text-lg shadow-lg active:scale-95 transition border border-zinc-600 text-emerald-400">
                    <i class="fa-solid fa-box mr-2"></i> 生態觀察箱
                </button>
                
                <div class="grid grid-cols-3 gap-2 mt-2">
                    <button onclick="openWeaponShop()" class="bg-zinc-800 hover:bg-zinc-700 p-3 rounded-2xl font-bold text-sm shadow-lg active:scale-95 transition border border-zinc-600 flex flex-col items-center justify-center text-blue-400 gap-1">
                        <i class="fa-solid fa-hammer text-xl"></i><span>武器庫</span>
                    </button>
                    <button onclick="openItemShop()" class="bg-zinc-800 hover:bg-zinc-700 p-3 rounded-2xl font-bold text-sm shadow-lg active:scale-95 transition border border-zinc-600 flex flex-col items-center justify-center text-cyan-400 gap-1">
                        <i class="fa-solid fa-box-open text-xl"></i><span>道具店</span>
                    </button>
                    <button onclick="openDex()" class="bg-zinc-800 hover:bg-zinc-700 p-3 rounded-2xl font-bold text-sm shadow-lg active:scale-95 transition border border-zinc-600 flex flex-col items-center justify-center text-purple-400 gap-1">
                        <i class="fa-solid fa-book-journal-whills text-xl"></i><span>圖鑑</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 模態視窗模板 -->
    <div id="modal-overlay" class="hidden absolute inset-0 bg-black/80 z-50 flex items-center justify-center backdrop-blur-sm p-4">
        <!-- 場景選擇 -->
        <div id="modal-scene" class="hidden bg-zinc-800 rounded-3xl w-full max-w-md border border-zinc-700 shadow-2xl overflow-hidden flex flex-col max-h-[80vh]">
            <div class="p-4 bg-zinc-900 border-b border-zinc-700 flex justify-between items-center">
                <h2 class="text-xl font-bold text-white"><i class="fa-solid fa-map-location-dot text-blue-400 mr-2"></i>選擇戰場</h2>
                <button onclick="closeModals()" class="text-gray-400 hover:text-white text-xl"><i class="fa-solid fa-times"></i></button>
            </div>
            <div class="p-4 overflow-y-auto flex flex-col gap-3" id="scene-list"></div>
        </div>

        <!-- 武器商店 -->
        <div id="modal-weapon" class="hidden bg-zinc-800 rounded-3xl w-full max-w-md border border-zinc-700 shadow-2xl overflow-hidden flex flex-col max-h-[85vh]">
            <div class="p-4 bg-zinc-900 border-b border-zinc-700 flex justify-between items-center">
                <h2 class="text-xl font-bold text-white"><i class="fa-solid fa-hammer text-blue-400 mr-2"></i>武器強化</h2>
                <div class="flex items-center gap-2"><i class="fa-solid fa-coins text-yellow-400"></i><span id="shop-coins" class="font-mono font-bold">0</span></div>
                <button onclick="closeModals()" class="text-gray-400 hover:text-white text-xl"><i class="fa-solid fa-times"></i></button>
            </div>
            <div class="p-4 overflow-y-auto flex flex-col gap-3" id="weapon-list"></div>
        </div>

        <!-- 道具商店 -->
        <div id="modal-item" class="hidden bg-zinc-800 rounded-3xl w-full max-w-md border border-zinc-700 shadow-2xl overflow-hidden flex flex-col max-h-[80vh]">
            <div class="p-4 bg-zinc-900 border-b border-zinc-700 flex justify-between items-center">
                <h2 class="text-xl font-bold text-white"><i class="fa-solid fa-box-open text-cyan-400 mr-2"></i>消耗品道具店</h2>
                <div class="flex items-center gap-2"><i class="fa-solid fa-coins text-yellow-400"></i><span id="item-shop-coins" class="font-mono font-bold">0</span></div>
                <button onclick="closeModals()" class="text-gray-400 hover:text-white text-xl"><i class="fa-solid fa-times"></i></button>
            </div>
            <div class="p-4 overflow-y-auto flex flex-col gap-3" id="item-list"></div>
        </div>

        <!-- 圖鑑 -->
        <div id="modal-dex" class="hidden bg-zinc-800 rounded-3xl w-full max-w-md border border-zinc-700 shadow-2xl overflow-hidden flex flex-col max-h-[80vh]">
            <div class="p-4 bg-zinc-900 border-b border-zinc-700 flex justify-between items-center">
                <h2 class="text-xl font-bold text-white"><i class="fa-solid fa-book-journal-whills text-purple-400 mr-2"></i>小強圖鑑</h2>
                <button onclick="closeModals()" class="text-gray-400 hover:text-white text-xl"><i class="fa-solid fa-times"></i></button>
            </div>
            <div class="p-4 grid grid-cols-2 gap-3 overflow-y-auto" id="dex-list"></div>
        </div>

        <!-- PvP 連線輸入 -->
        <div id="modal-pvp" class="hidden bg-zinc-800 rounded-3xl w-full max-w-sm border border-zinc-700 shadow-2xl overflow-hidden flex flex-col">
            <div class="p-4 bg-zinc-900 border-b border-zinc-700 flex justify-between items-center">
                <h2 class="text-xl font-bold text-white"><i class="fa-solid fa-wifi text-purple-400 mr-2"></i>連線對戰</h2>
                <button onclick="closeModals()" class="text-gray-400 hover:text-white text-xl"><i class="fa-solid fa-times"></i></button>
            </div>
            <div class="p-6 flex flex-col items-center">
                <p class="text-sm text-gray-400 text-center mb-4">輸入相同的房號與朋友連線！</p>
                <input type="text" id="pvp-room-input" placeholder="輸入房號 (例: 1234)" class="w-full bg-zinc-900 border border-zinc-600 rounded-xl p-3 text-center text-xl font-bold text-white mb-4 focus:outline-none focus:border-purple-500">
                <button onclick="connectPvP()" class="w-full bg-purple-600 hover:bg-purple-500 py-3 rounded-xl font-bold text-lg shadow-lg active:scale-95 transition">
                    連線並準備
                </button>
                <p id="pvp-status-text" class="text-sm text-yellow-400 mt-3 hidden">連線中，等待對手...</p>
            </div>
        </div>
    </div>

    <!-- ================= 遊戲主畫面 ================= -->
    <div id="game-container" class="absolute inset-0 hidden">
        <!-- 頂部狀態列 -->
        <div id="top-bar" class="absolute top-0 left-0 right-0 z-30 p-2 sm:p-4 flex justify-between items-start pointer-events-none">
            <!-- 左上：分數/血量/等級 (單人) -->
            <div id="battle-stats" class="bg-black/60 backdrop-blur-sm rounded-2xl p-2 sm:p-3 border border-white/10 pointer-events-auto flex flex-col gap-1">
                <div class="flex items-center gap-2 text-xl sm:text-2xl font-black font-mono">
                    <i class="fa-solid fa-skull text-gray-400"></i><span id="score" class="text-white">0</span>
                </div>
                <div class="flex items-center gap-2">
                    <i class="fa-solid fa-heart text-red-500"></i>
                    <div class="w-24 sm:w-32 bg-gray-800 rounded-full h-3">
                        <div id="hp-bar" class="bg-red-500 h-3 rounded-full transition-all duration-300" style="width: 100%"></div>
                    </div>
                </div>
                <div class="text-[10px] text-gray-300 font-bold tracking-widest uppercase mt-1">
                    Lv.<span id="game-level">1</span> <span id="game-title" class="text-blue-300">見習生</span>
                </div>
            </div>

            <!-- 左上：PvP 血量 (連線時顯示) -->
            <div id="pvp-stats" class="hidden bg-black/80 backdrop-blur-sm rounded-2xl p-3 border border-purple-500/50 pointer-events-auto flex flex-col gap-2 w-full max-w-sm mx-auto">
                <div class="flex justify-between items-center w-full text-sm font-bold">
                    <span class="text-blue-400">你</span> <span class="text-red-400 text-xs">VS</span> <span class="text-purple-400">對手</span>
                </div>
                <div class="flex items-center gap-2 w-full">
                    <!-- 我的血量 -->
                    <div class="flex-1 bg-gray-800 rounded-full h-4 rotate-180">
                        <div id="pvp-my-hp" class="bg-blue-500 h-4 rounded-full transition-all duration-300 shadow-[0_0_10px_rgba(59,130,246,0.5)]" style="width: 100%"></div>
                    </div>
                    <!-- 對手血量 -->
                    <div class="flex-1 bg-gray-800 rounded-full h-4">
                        <div id="pvp-opponent-hp" class="bg-purple-500 h-4 rounded-full transition-all duration-300 shadow-[0_0_10px_rgba(168,85,247,0.5)]" style="width: 100%"></div>
                    </div>
                </div>
                <div class="text-center text-[10px] text-yellow-400 font-mono mt-1 font-bold tracking-wider">
                    目標: 盡快消滅小強！
                </div>
            </div>

            <!-- 右上：時間與金幣 -->
            <div class="bg-black/60 backdrop-blur-sm rounded-2xl p-2 sm:p-3 border border-white/10 pointer-events-auto text-right flex flex-col gap-1 items-end">
                <div class="text-base sm:text-lg font-mono font-bold text-gray-300 flex items-center gap-2">
                    <i id="time-icon" class="fa-solid fa-sun text-yellow-400"></i><span id="time-display">08:00</span>
                </div>
                <div class="text-sm font-bold text-yellow-400 flex items-center gap-1">
                    <i class="fa-solid fa-coins"></i> <span id="session-coins">0</span>
                </div>
            </div>
            
            <!-- 生態箱工具 (隱藏於挑戰模式) -->
            <div id="sandbox-tools" class="hidden absolute top-20 right-2 sm:right-4 bg-black/60 backdrop-blur-sm rounded-2xl p-2 flex flex-col gap-2 pointer-events-auto border border-white/10">
                <button onclick="setTool('food')" id="btn-tool-food" class="p-2 bg-zinc-700 rounded-xl text-yellow-400 ring-2 ring-yellow-400"><i class="fa-solid fa-cookie"></i></button>
                <button onclick="setTool('roach')" id="btn-tool-roach" class="p-2 bg-zinc-800 rounded-xl text-gray-400 hover:bg-zinc-700"><i class="fa-solid fa-bug"></i></button>
            </div>
            
            <!-- 生態箱資訊 -->
            <div id="sandbox-stats" class="hidden absolute top-4 left-4 bg-black/60 backdrop-blur-sm rounded-2xl p-3 border border-white/10 pointer-events-auto">
                <div class="text-lg font-bold text-emerald-400 mb-1"><i class="fa-solid fa-box"></i> 生態觀察</div>
                <div class="text-sm text-gray-300">小強數量: <span id="roach-count" class="font-mono">0</span></div>
            </div>
        </div>

        <!-- PvP 懸浮道具欄 (在遊戲右側，對戰時才有用) -->
        <div id="pvp-traps-panel" class="hidden absolute right-3 top-[35%] z-40 flex flex-col gap-3 pointer-events-auto">
            <!-- 顯示對戰幣 -->
            <div class="bg-zinc-900/90 border border-yellow-500/50 rounded-full px-2 py-1 flex items-center justify-center gap-1 shadow-lg mb-1">
                <i class="fa-solid fa-coins text-yellow-400 text-[10px]"></i>
                <span id="pvp-coins-text" class="text-xs font-mono font-bold text-white">0</span>
            </div>
            <!-- 致盲迷霧 -->
            <button onclick="buyPvPTrap('darken')" id="btn-trap-darken" class="group bg-zinc-900/90 hover:bg-zinc-800 border-2 border-purple-500/50 rounded-2xl p-2.5 flex flex-col items-center justify-center w-14 h-14 sm:w-16 sm:h-16 shadow-2xl active:scale-95 transition opacity-50">
                <i class="fa-solid fa-eye-slash text-purple-400 text-sm sm:text-base group-hover:animate-pulse"></i>
                <span class="text-[8px] font-bold text-purple-200 mt-1">致盲迷霧</span>
                <span class="text-[9px] font-mono font-black text-yellow-400 mt-0.5">$100</span>
            </button>
            <!-- 小強突襲 -->
            <button onclick="buyPvPTrap('swarm')" id="btn-trap-swarm" class="group bg-zinc-900/90 hover:bg-zinc-800 border-2 border-red-500/50 rounded-2xl p-2.5 flex flex-col items-center justify-center w-14 h-14 sm:w-16 sm:h-16 shadow-2xl active:scale-95 transition opacity-50">
                <i class="fa-solid fa-bugs text-red-400 text-sm sm:text-base group-hover:animate-bounce"></i>
                <span class="text-[8px] font-bold text-red-200 mt-1">小強突襲</span>
                <span class="text-[9px] font-mono font-black text-yellow-400 mt-0.5">$150</span>
            </button>
            <!-- 小強派對 -->
            <button onclick="buyPvPTrap('party')" id="btn-trap-party" class="group bg-zinc-900/90 hover:bg-zinc-800 border-2 border-yellow-500/50 rounded-2xl p-2.5 flex flex-col items-center justify-center w-14 h-14 sm:w-16 sm:h-16 shadow-2xl active:scale-95 transition opacity-50">
                <i class="fa-solid fa-champagne-glasses text-yellow-400 text-sm sm:text-base group-hover:animate-bounce"></i>
                <span class="text-[8px] font-bold text-yellow-200 mt-1">小強派對</span>
                <span class="text-[9px] font-mono font-black text-yellow-400 mt-0.5">$250</span>
            </button>
        </div>

        <!-- 遊戲畫布 (SVG) -->
        <svg id="game-svg" class="w-full h-full cursor-crosshair relative z-10" preserveAspectRatio="xMidYMid slice">
            <defs>
                <radialGradient id="splat-grad" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" stop-color="#4ade80" stop-opacity="0.8"/>
                    <stop offset="100%" stop-color="#166534" stop-opacity="0"/>
                </radialGradient>
                <radialGradient id="poison-grad" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" stop-color="#10b981" stop-opacity="0.9"/>
                    <stop offset="70%" stop-color="#047857" stop-opacity="0.5"/>
                    <stop offset="100%" stop-color="#064e3b" stop-opacity="0"/>
                </radialGradient>
                <radialGradient id="gold-grad" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" stop-color="#fef08a"/>
                    <stop offset="60%" stop-color="#eab308"/>
                    <stop offset="100%" stop-color="#a16207"/>
                </radialGradient>
            </defs>

            <!-- ================= 場景 1: 廚房 ================= -->
            <g id="bg-kitchen" class="scene-hidden">
                <rect width="100%" height="100%" fill="#8B5A2B"/>
                <rect width="100%" height="100%" fill="url(#kitchen-wood)" opacity="0.3"/>
                <pattern id="kitchen-wood" width="100" height="40" patternUnits="userSpaceOnUse">
                    <line x1="0" y1="0" x2="100" y2="0" stroke="#5C3A21" stroke-width="2"/>
                    <path d="M 20 0 Q 30 20 40 0 M 70 0 Q 75 10 80 0" stroke="#5C3A21" fill="none" opacity="0.5"/>
                </pattern>
                
                <!-- Corner Decorations -->
                <!-- Top Left: Cloth -->
                <g id="kit-tl" opacity="0.9">
                    <path d="M -20 -20 L 120 -20 L 90 80 Q 50 100 -20 120 Z" fill="#f87171"/>
                    <path d="M -20 -20 L 120 -20 L 90 80 Q 50 100 -20 120 Z" fill="url(#grid-pattern)"/>
                </g>
                <pattern id="grid-pattern" width="20" height="20" patternUnits="userSpaceOnUse">
                    <line x1="0" y1="0" x2="20" y2="0" stroke="#ffffff" stroke-width="2" opacity="0.5"/>
                    <line x1="0" y1="0" x2="0" y2="20" stroke="#ffffff" stroke-width="2" opacity="0.5"/>
                </pattern>
                <!-- Bottom Left: Cutting Board -->
                <g id="kit-bl">
                    <rect x="10" y="-120" width="140" height="100" rx="15" fill="#d97706" transform="rotate(-15)"/>
                    <circle cx="80" cy="-70" r="25" fill="#fef08a" transform="rotate(-15)"/>
                    <circle cx="80" cy="-70" r="20" fill="#fde047" transform="rotate(-15)"/>
                    <path d="M 80 -70 L 65 -85 M 80 -70 L 95 -85 M 80 -70 L 65 -55 M 80 -70 L 95 -55" stroke="#ca8a04" stroke-width="2" transform="rotate(-15)"/>
                </g>
                <!-- Bottom Right: Coffee -->
                <g id="kit-br">
                    <circle cx="-60" cy="-60" r="45" fill="#e5e7eb"/>
                    <circle cx="-60" cy="-60" r="35" fill="#78350f"/>
                    <path d="M -75 -60 Q -60 -80 -45 -60 Q -60 -40 -75 -60" fill="#fde68a" opacity="0.8"/>
                    <path d="M -20 -70 C -5 -70 -5 -50 -20 -50" fill="none" stroke="#e5e7eb" stroke-width="8"/>
                </g>
                <!-- Top Right: Spices -->
                <g id="kit-tr">
                    <rect x="-70" y="10" width="40" height="60" rx="10" fill="#f3f4f6" opacity="0.9"/>
                    <rect x="-65" y="5" width="30" height="15" fill="#9ca3af"/>

    <script>
        // ==========================================
        // Audio System (音效合成器)
        // ==========================================
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let isMuted = true; // 預設靜音，需點擊解鎖
        let bgmOscillators = [];
        let bgmInterval;

        const btnMute = document.getElementById('btn-mute');
        const iconMute = document.getElementById('icon-mute');
        
        btnMute.addEventListener('click', () => {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            isMuted = !isMuted;
            iconMute.className = isMuted ? "fa-solid fa-volume-xmark" : "fa-solid fa-volume-high";
            if (!isMuted && !bgmInterval) startBGM();
            else if (isMuted) stopBGM();
        });

        // 8-bit BGM 排程器
        function startBGM() {
            if (isMuted) return;
            const tempo = 120;
            const beatLen = 60 / tempo;
            
            const bassLine = [130.81, 130.81, 174.61, 174.61, 196.00, 196.00, 130.81, 130.81];
            const arpLine =  [523.25, 659.25, 698.46, 880.00, 783.99, 987.77, 523.25, 783.99];
            
            let step = 0;
            
            function playStep() {
                if(isMuted) return;
                const time = audioCtx.currentTime;
                
                // Bass (Triangle)
                const bassOsc = audioCtx.createOscillator();
                const bassGain = audioCtx.createGain();
                bassOsc.type = 'triangle';
                bassOsc.frequency.value = bassLine[step % 8];
                bassOsc.connect(bassGain);
                bassGain.connect(audioCtx.destination);
                bassGain.gain.setValueAtTime(0.2, time);
                bassGain.gain.exponentialRampToValueAtTime(0.01, time + beatLen * 0.8);
                bassOsc.start(time);
                bassOsc.stop(time + beatLen);
                
                // Melody Arp (Square)
                if (step % 2 === 0) {
                    const arpOsc = audioCtx.createOscillator();
                    const arpGain = audioCtx.createGain();
                    arpOsc.type = 'square';
                    arpOsc.frequency.value = arpLine[step % 8];
                    arpOsc.connect(arpGain);
                    arpGain.connect(audioCtx.destination);
                    arpGain.gain.setValueAtTime(0.05, time);
                    arpGain.gain.exponentialRampToValueAtTime(0.01, time + beatLen * 0.4);
                    arpOsc.start(time);
                    arpOsc.stop(time + beatLen * 0.5);
                }
                
                step++;
                bgmInterval = setTimeout(playStep, beatLen * 1000);
            }
            playStep();
        }

        function stopBGM() {
            if(bgmInterval) clearTimeout(bgmInterval);
            bgmInterval = null;
        }

        function playSynth(type, freq, type2='square', freq2=0, dur=0.1, vol=0.1) {
            if (isMuted) return;
            const t = audioCtx.currentTime;
            const o = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            o.type = type; o.frequency.setValueAtTime(freq, t);
            if(type==='exponential') o.frequency.exponentialRampToValueAtTime(10, t+dur);
            o.connect(g); g.connect(audioCtx.destination);
            g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.01, t+dur);
            o.start(t); o.stop(t+dur);
            
            if(freq2 > 0) {
                const o2 = audioCtx.createOscillator();
                const g2 = audioCtx.createGain();
                o2.type = type2; o2.frequency.setValueAtTime(freq2, t);
                o2.connect(g2); g2.connect(audioCtx.destination);
                g2.gain.setValueAtTime(vol/2, t); g2.gain.exponentialRampToValueAtTime(0.01, t+dur);
                o2.start(t); o2.stop(t+dur);
            }
        }

        const playSound = {

        ];

        let db = {
            level: parseInt(localStorage.getItem('roach_level')) || 1,
            exp: parseInt(localStorage.getItem('roach_exp')) || 0,
            coins: parseInt(localStorage.getItem('roach_coins')) || 0,

            scenes: JSON.parse(localStorage.getItem('roach_scenes')) || ['kitchen'],

        };

        let gameState = {
            active: false, mode: 'battle', scene: 'kitchen',

            tool: 'food', combo: 0, lastKillTime: 0,
            time: 8 * 60,
            isNight: false, timeSpeed: 2,
            shieldActive: false, shieldEndTime: 0
        };

        let pvpState = {
            active: false,
            roomCode: '',
            myPlayerId: 'p_' + Math.random().toString(36).substr(2, 9),
            opponentId: null,
            opponentHp: 100,
            pvpCoins: 0,
            lastOpponentHeartbeat: 0
        };

        let roaches = [], foods = [], corpses = [], particles = [];
        let spawnTimer = 0, lastTime = 0, animationId, isSwiping = false, swarmTimer = 0;
        let draggedRoach = null, lastDragPos = { x: 0, y: 0 }, dragVelocity = { x: 0, y: 0 };
        let width = window.innerWidth, height = window.innerHeight;
        const svg = document.getElementById('game-svg');

        // ==========================================
        // Lobby Animation
        // ==========================================
        const lCanvas = document.getElementById('lobby-canvas');
        const lCtx = lCanvas.getContext('2d');
        let lParticles = [], lRoaches = [];
        function initLobbyAnim() {
            lCanvas.width = window.innerWidth; lCanvas.height = window.innerHeight;
            for(let i=0;i<50;i++) lParticles.push({x:Math.random()*lCanvas.width, y:Math.random()*lCanvas.height, s:Math.random()*2+1, vx:(Math.random()-0.5)*0.5, vy:-Math.random()*1});
            for(let i=0;i<5;i++) lRoaches.push({x:Math.random()*lCanvas.width, y:Math.random()*lCanvas.height, vx:(Math.random()-0.5)*2, vy:(Math.random()-0.5)*2, angle:0});
        }
        function drawLobby() {
            if(gameState.active) return;
            lCtx.clearRect(0,0,lCanvas.width,lCanvas.height);
            lCtx.fillStyle = '#fde047';
            lParticles.forEach(p => { p.x+=p.vx; p.y+=p.vy; if(p.y<0) p.y=lCanvas.height; lCtx.globalAlpha=0.3; lCtx.beginPath(); lCtx.arc(p.x,p.y,p.s,0,Math.PI*2); lCtx.fill(); });
            lCtx.fillStyle = '#000000';
            lRoaches.forEach(r => {
                r.x+=r.vx; r.y+=r.vy; r.angle = Math.atan2(r.vy, r.vx);
                if(r.x<0||r.x>lCanvas.width) r.vx*=-1; if(r.y<0||r.y>lCanvas.height) r.vy*=-1;
                lCtx.save(); lCtx.translate(r.x,r.y); lCtx.rotate(r.angle);
                lCtx.globalAlpha=0.15; lCtx.beginPath(); lCtx.ellipse(0,0,10,5,0,0,Math.PI*2); lCtx.fill(); lCtx.restore();
            });
            requestAnimationFrame(drawLobby);
        }
        window.addEventListener('resize', () => { width=window.innerWidth; height=window.innerHeight; if(!gameState.active){ lCanvas.width=width; lCanvas.height=height; } resizeGame(); });

        // ==========================================
        // Level & Exp System
        // ==========================================
        function getTitle(lv) {
            let t = TITLE_CONFIG[0];
            for (let i = 0; i < TITLE_CONFIG.length; i++) { if (lv >= TITLE_CONFIG[i].lv) t = TITLE_CONFIG[i]; }
            return t;
        }
        function getExpReq(lv) { return Math.floor(100 * Math.pow(1.2, lv - 1)); }
        
        function addExp(amount) {
            db.exp += amount;
            let req = getExpReq(db.level);
            let leveledUp = false;
            let oldTitle = getTitle(db.level).name;
            while (db.exp >= req) {
                db.exp -= req;
                db.level++;
                leveledUp = true;
                req = getExpReq(db.level);
            }
            saveDb();
            updateLobbyUI();
            
            if (leveledUp) {
                playSound.levelup();
                document.getElementById('lu-level').textContent = db.level;
                let newTitle = getTitle(db.level);
                let titleDiv = document.getElementById('lu-title-unlock');
                if(newTitle.name !== oldTitle) {
                    titleDiv.textContent = `解鎖新稱號: ${newTitle.name}!`;
                    titleDiv.classList.remove('hidden');

        function connectPvP() {
            const code = document.getElementById('pvp-room-input').value.trim();
            if (!code) return alert("請輸入房號！");
            
            pvpState.roomCode = code;
            document.getElementById('pvp-status-text').classList.remove('hidden');
            document.getElementById('pvp-status-text').textContent = "連線伺服器中 (MQTTGO)...";
            
            try {
                mqttClient = mqtt.connect('wss://mqttgo.io:8084/mqtt');
                
                mqttClient.on('connect', () => {
                    document.getElementById('pvp-status-text').textContent = "已連線！等待對手...";
                    document.getElementById('pvp-status-text').className = "text-sm mt-3 font-bold text-green-400";
                    
                    const topic = `roach_battle_${pvpState.roomCode}`;
                    mqttClient.subscribe(topic);
                    
                    setInterval(() => {
                        if (pvpState.active) {
                            sendPvpMsg({
                                type: 'ping',
                                sender: pvpState.myPlayerId,
                                senderHp: gameState.targetHp
                            });
                        }
                    }, 2000);
                    
                    sendPvpMsg({
                        type: 'ping',
                        sender: pvpState.myPlayerId,
                        senderHp: 100
                    });
                });

                mqttClient.on('message', (topic, message) => {
                    try {
                        const data = JSON.parse(message.toString());
                        if (data.sender !== pvpState.myPlayerId) {
                            handlePvPMsg(data);
                        }
                    } catch (e) { console.error("MQTT Msg parse error", e); }
                });
            } catch (e) {
                alert("MQTT 連線失敗: " + e);
            }
        }

        function sendPvpMsg(payload) {
            if(mqttClient && mqttClient.connected) {
                const topic = `roach_battle_${pvpState.roomCode}`;
                mqttClient.publish(topic, JSON.stringify(payload));
            }
        }

        function handlePvPMsg(msg) {
            if (msg.type === 'ping') {
                pvpState.lastOpponentHeartbeat = performance.now();
                if (!pvpState.opponentId) {
                    pvpState.opponentId = msg.sender;
                    sendPvpMsg({ type: 'ping', sender: pvpState.myPlayerId, senderHp: gameState.targetHp });
                    startPvPGameSession();
                } else if (pvpState.opponentId === msg.sender) {
                    pvpState.opponentHp = msg.senderHp;
                    updateOpponentHpUI();
                }
            } else if (msg.type === 'hp_sync') {
                pvpState.opponentHp = msg.hp;
                updateOpponentHpUI();
            } else if (msg.type === 'trap_darken') {
                applyDarkenTrap();
            } else if (msg.type === 'trap_swarm') {
                applySwarmTrap();
            } else if (msg.type === 'trap_party') {
                applyPartyTrap();
            } else if (msg.type === 'game_over_lose') {
                triggerPvPWin();
            }
        }

        function buyPvPTrap(type) {
            if (!pvpState.active) return;
            const traps = { darken: 100, swarm: 150, party: 250 };
            const cost = traps[type];
            if (pvpState.pvpCoins >= cost) {
                pvpState.pvpCoins -= cost;
                updatePvpCoinsUI();
                sendPvpMsg({ type: `trap_${type}`, sender: pvpState.myPlayerId });
                playSound.success();
            } else { playSound.damage(); }
        }

        function applyPartyTrap() {
            playSound.levelup();
            const notif = document.getElementById('pvp-trap-notification');
            document.getElementById('pvp-notif-msg').textContent = "⚠️ 對手舉辦了小強派對！";

            const count = 5 + Math.floor(Math.random() * 6);
            const corners = [{x: 0, y: 0}, {x: width, y: 0}, {x: 0, y: height}, {x: width, y: height}];

            for (let i = 0; i < count; i++) {
                const corner = corners[i % 4];
                const rx = corner.x + (Math.random() - 0.5) * 40;
                const ry = Math.max(65, corner.y + (Math.random() - 0.5) * 40);
                roaches.push(new Cockroach(rx, ry, false));

        function startGame(sceneId) {

            gameState.scene = sceneId;
            Object.values(SCENE_CONFIG).forEach(c => { document.getElementById(c.bgId).classList.add('scene-hidden'); document.getElementById(c.targetId).style.display='none'; });
            document.getElementById(SCENE_CONFIG[sceneId].bgId).classList.remove('scene-hidden');

                document.getElementById('pvp-stats').classList.add('hidden');
                document.getElementById('pvp-traps-panel').classList.add('hidden');
                document.getElementById(SCENE_CONFIG[sceneId].targetId).style.display = 'block';
                
                gameState.score = 0; gameState.sessionCoins = 0; gameState.targetHp = 100;
                gameState.combo = 0; gameState.time = 8*60; gameState.timeSpeed = 2;
                gameState.cooldowns = { slipper:0, grandma_slipper:0, newspaper:0, pesticide_bomb:0, gold_slipper:0 };
                
                document.getElementById('game-level').textContent = db.level;
                let titleObj = getTitle(db.level);
                let gTitle = document.getElementById('game-title');
                gTitle.textContent = titleObj.name;
                gTitle.className = `text-xs ${titleObj.color}`;
                
                buildInGameWeaponBar();
                updateTargetHp();
                updateItemUI();
                pvpState.active = false;
            } else {
                document.getElementById('top-bar').classList.remove('hidden');
                document.getElementById('battle-stats').classList.add('hidden');
                document.getElementById('bottom-bar').classList.add('hidden');
                document.getElementById('sandbox-stats').classList.remove('hidden');
                document.getElementById('sandbox-tools').classList.remove('hidden');
                document.getElementById('pvp-stats').classList.add('hidden');
                document.getElementById('pvp-traps-panel').classList.add('hidden');
                gameState.time = 12*60; gameState.timeSpeed = 0.5;

                // 🚀 初始化生態箱：立刻產生 10 隻不同屬性的小強！
                clearEntities();
                for (let i = 0; i < 10; i++) {
                    let rx = Math.random() * (width - 100) + 50;
                    let ry = Math.max(80, Math.random() * (height - 150) + 50);
                    roaches.push(new Cockroach(rx, ry, true));
                }
            }

            gameState.active = true;
            resizeGame();
            
            if(!bgmInterval) startBGM();
            lastTime = performance.now();
            requestAnimationFrame(gameLoop);
        }

        function clearEntities() { roaches = []; foods = []; corpses = []; particles = []; document.getElementById('roaches-layer').innerHTML = ''; document.getElementById('food-layer').innerHTML = ''; document.getElementById('corpses-layer').innerHTML = ''; document.getElementById('effects-layer').innerHTML = ''; }

            if (db.items.plastic_wrap > 0) {
                const btn = document.createElement('button');
                btn.className = `relative flex items-center justify-center w-12 h-12 sm:w-14 sm:h-14 rounded-xl border-2 border-blue-500/50 bg-zinc-800 mr-2 active:scale-95 transition`;
                btn.onclick = usePlasticWrap;
                btn.innerHTML = `<i class="fa-solid fa-shield text-xl text-blue-300"></i><span class="absolute -top-2 -right-2 bg-purple-600 text-[10px] font-bold px-1.5 rounded-full">${db.items.plastic_wrap}</span><div id="item-cd-overlay" class="absolute bottom-0 left-0 w-full bg-black/60 cooldown-overlay rounded-lg" style="height: 0%;"></div>`;
                bar.appendChild(btn);
            }

            db.weapons.forEach(wKey => {
                const w = WEAPON_CONFIG[wKey];
                const lv = db.w_levels[wKey];
                const isActive = gameState.weapon === wKey;
                const btn = document.createElement('button');
                btn.className = `relative flex items-center justify-center w-12 h-12 sm:w-14 sm:h-14 rounded-xl border-2 transition active:scale-95 ${isActive ? `bg-zinc-700 ${wKey==='gold_slipper'?'border-yellow-400 weapon-glow':'border-white'}` : 'bg-zinc-900 border-zinc-700'}`;
                btn.onclick = () => setWeapon(wKey);
                btn.innerHTML = `
                    <i class="fa-solid ${w.icon} text-xl sm:text-2xl ${w.color} ${wKey==='gold_slipper'?'weapon-glow':''}"></i>
                    <div id="cd-${wKey}" class="absolute bottom-0 left-0 w-full bg-black/70 cooldown-overlay flex items-center justify-center rounded-lg" style="height: 0%;"><span class="text-xs font-bold text-white cd-text hidden"></span></div>
                    <span class="absolute -bottom-2 bg-zinc-800 text-[8px] sm:text-[10px] px-1 rounded border border-zinc-600">Lv.${lv}</span>
                `;
                bar.appendChild(btn);
            });
        }

        function updateItemUI() { buildInGameWeaponBar(); }

        function usePlasticWrap() {
            if (gameState.shieldActive || db.items.plastic_wrap <= 0) return;
            db.items.plastic_wrap--;
            saveDb();
            updateItemUI();
            
            gameState.shieldActive = true;
            gameState.shieldEndTime = performance.now() + 5000;
            
            const shieldEl = document.getElementById(`shield-${SCENE_CONFIG[gameState.scene].targetId.split('-')[1]}`);
            if(shieldEl) shieldEl.classList.remove('hidden');
            
            playSound.success();
            if(pvpState.active) sendPvpMsg({type: 'trap', sender: pvpState.myPlayerId});
        }

        // ==========================================
        // Game Entities (小強定義)
        // ==========================================
        class Cockroach {
            constructor(x, y, isSandbox) {
                this.x = x; this.y = y;
                this.isSandbox = isSandbox;
                this.isDragged = false; // 拖曳狀態追蹤
                
                const rand = Math.random();
                this.type = 'normal';
                this.hp = 1; this.speed = 100 + (db.level * 2); this.size = 1; this.color = '#854d0e';
                this.vx = 0; this.vy = 0; this.target = null;
                this.element = document.createElementNS("http://www.w3.org/2000/svg", "g");

                if (rand < 0.15) {
                    this.type = 'ninja'; this.speed *= 2.0; this.color = '#6b21a8';
                } else if (rand < 0.1) {
                    this.type = 'golden'; this.speed *= 2.5; this.size = 0.7; this.color = '#eab308';
                } else if (rand < 0.25) {
                    this.type = 'tank'; this.hp = 3 + Math.floor(gameState.score/500); this.speed *= 0.6; this.size = 1.4; this.color = '#1f2937';
                }
                
                this.draw();
                document.getElementById('roaches-layer').appendChild(this.element);
            }

            draw() {
                const s = this.size;
                let bodyHtml = `<ellipse cx="0" cy="0" rx="${8*s}" ry="${15*s}" fill="${this.color}"/>`;
                if(this.type === 'tank') {
                    bodyHtml += `<rect x="${-6*s}" y="${-10*s}" width="${12*s}" height="${20*s}" fill="#374151" rx="2"/><line x1="${-6*s}" y1="0" x2="${6*s}" y2="0" stroke="#9ca3af" stroke-width="2"/>`;
                } else if(this.type === 'golden') {
                    bodyHtml += `<ellipse cx="0" cy="0" rx="${6*s}" ry="${12*s}" fill="#fde047"/><circle cx="0" cy="0" r="${3*s}" fill="#ffffff" opacity="0.8"/>`;
                }
                
                this.element.innerHTML = `
                    <line x1="${-3*s}" y1="${-14*s}" x2="${-12*s}" y2="${-25*s}" stroke="${this.color}" stroke-width="${1*s}"/>
                    <line x1="${3*s}" y1="${-14*s}" x2="${12*s}" y2="${-25*s}" stroke="${this.color}" stroke-width="${1*s}"/>
                    <path d="M ${-8*s} ${-5*s} Q ${-16*s} 0 ${-8*s} ${10*s} M ${8*s} ${-5*s} Q ${16*s} 0 ${8*s} ${10*s}" fill="none" stroke="${this.color}" stroke-width="${1.5*s}"/>
                    <path d="M ${-7*s} ${8*s} L ${-14*s} ${16*s} M ${7*s} ${8*s} L ${14*s} ${16*s}" fill="none" stroke="${this.color}" stroke-width="${1.5*s}"/>
                    ${bodyHtml}
                `;
            }

            update(dt) {
                if (this.isDragged) return; // 被抓著時不更新自然移動

                if(this.isSandbox) {
                    if(this.target) {
                        const foodIdx = foods.indexOf(this.target);
                        if (foodIdx > -1) {
                            const dx = this.target.x - this.x, dy = this.target.y - this.y;
                            const dist = Math.hypot(dx, dy);
                            if(dist < 15) { 
                                // 停止移動並在原地專心吃東西
                                this.vx = 0; 
                                this.vy = 0; 
                                this.target.hp -= dt * 30; 
                                
                                if(Math.random() < 0.2) {
                                    playSound.eat();
                                    spawnParticle(this.x, this.y, '#fcd34d', 2);
                                }
                                
                                if(this.target.hp <= 0) {
                                    this.target.element.remove();
                                    foods.splice(foodIdx, 1);
                                    this.target = null;
                                }
                            }
                            else { 
                                this.vx = dx/dist*this.speed*dt; 
                                this.vy = dy/dist*this.speed*dt; 
                            }
                        } else {
                            this.target = null;
                        }
                    } else {
                        if(foods.length > 0) {
                            // 尋找最近的食物
                            let closest = null;
                            let minDist = Infinity;
                            for (let f of foods) {
                                let d = Math.hypot(f.x - this.x, f.y - this.y);
                                if (d < minDist) {
                                    minDist = d;
                                    closest = f;
                                }
                            }
                            this.target = closest;
                        } else {
                            // 漫遊
                            if(Math.random() < 0.05){ 
                                this.vx = (Math.random() - 0.5) * 150 * dt; 
                                this.vy = (Math.random() - 0.5) * 150 * dt; 
                            }
                        }
                    }
                } else {
                    const tx = width/2, ty = height/2;
                    const dx = tx - this.x, dy = ty - this.y;
                    const dist = Math.hypot(dx, dy);
                    const targetRad = SCENE_CONFIG[gameState.scene].targetRadius;
                    
                    if(dist < targetRad) {
                        if (!gameState.shieldActive) {
                            playSound.eat();
                            gameState.targetHp -= dt * 5;
                            updateTargetHp();
                        } else {
                            if(Math.random()<0.1) spawnParticle(this.x, this.y, '#60a5fa', 1);
                        }
                    } else {
                        const wiggle = Math.sin(performance.now()/100) * 0.5;
                        const angle = Math.atan2(dy, dx) + wiggle;
                        this.vx = Math.cos(angle) * this.speed * dt;
                        this.vy = Math.sin(angle) * this.speed * dt;
                    }
                }
                
                this.x += this.vx; this.y += this.vy;

                if (this.isSandbox) {
                    const margin = 20;
                    if(this.x < margin || this.x > width - margin) { this.vx *= -1; this.x = Math.max(margin, Math.min(width - margin, this.x)); }
                    if(this.y < 65 || this.y > height - margin) { this.vy *= -1; this.y = Math.max(65, Math.min(height - margin, this.y)); }
                }

                const angle = Math.atan2(this.vy, this.vx) * 180 / Math.PI + 90;
                this.element.setAttribute('transform', `translate(${this.x}, ${this.y}) rotate(${angle})`);
            }
        }

        // ==========================================
        // Main Loop
        // ==========================================
        function gameLoop(currentTime) {
            if (!gameState.active) return;
            const dt = (currentTime - lastTime) / 1000;
            lastTime = currentTime;

            updateTimeAndSpawns(dt);
            updateEntities(dt);
            updateCooldowns();
            
            if (gameState.shieldActive && currentTime > gameState.shieldEndTime) {
                gameState.shieldActive = false;
                const shieldEl = document.getElementById(`shield-${SCENE_CONFIG[gameState.scene].targetId.split('-')[1]}`);
                if(shieldEl) shieldEl.classList.add('hidden');
            }

            if (gameState.mode === 'battle' && gameState.targetHp <= 0) {
                if (pvpState.active) triggerPvPLose();
                else triggerGameOver();
                return;
            }

            animationId = requestAnimationFrame(gameLoop);
        }

        function updateTimeAndSpawns(dt) {
            gameState.time += dt * gameState.timeSpeed;
            if(gameState.time >= 24*60) gameState.time = 0;
            const h = Math.floor(gameState.time/60), m = Math.floor(gameState.time%60);
            document.getElementById('time-display').textContent = `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}`;
            
            const isNightNow = (h >= 18 || h < 6);
            if(isNightNow !== gameState.isNight) {
                gameState.isNight = isNightNow;
                document.getElementById('time-icon').className = isNightNow ? 'fa-solid fa-moon text-blue-300' : 'fa-solid fa-sun text-yellow-400';
                document.getElementById('night-overlay').style.display = isNightNow ? 'block' : 'none';
            }

            if(gameState.mode === 'battle') {
                spawnTimer -= dt;
                swarmTimer -= dt;
                
                if (swarmTimer <= 0) {
                    triggerSwarm();
                    swarmTimer = 30;
                }

                let baseRate = 1.5 - (db.level * 0.02) - (gameState.score / 500);
                if(gameState.isNight) baseRate *= 0.7;
                if (spawnTimer <= 0) { spawnRoach(); spawnTimer = Math.max(0.3, baseRate + Math.random() * 0.5); }
            } else if (gameState.mode === 'sandbox') {
                document.getElementById('roach-count').textContent = roaches.length;
            }
        }

        function triggerSwarm() {
            playSound.alert();
            const notif = document.getElementById('pvp-trap-notification');
            document.getElementById('pvp-notif-msg').innerHTML = "⚠️ 小強大軍來襲！ ⚠️";
            notif.classList.remove('hidden');
            for(let i=0; i<12; i++) { setTimeout(() => spawnRoach(), i*200); }
            setTimeout(() => { notif.classList.add('hidden'); }, 3000);
        }

        function spawnRoach() {
            let rx, ry;
            if(Math.random()<0.5) { rx = Math.random()<0.5 ? -20 : width+20; ry = Math.random()*height; }
            else { rx = Math.random()*width; ry = Math.random()<0.5 ? -20 : height+20; }
            if (gameState.scene === 'kitchen') ry = Math.max(65, ry);
            roaches.push(new Cockroach(rx, ry, false));
        }

        function updateEntities(dt) {
            roaches.forEach(r => r.update(dt));
            
            for(let i=particles.length-1; i>=0; i--) {
                const p = particles[i];
                p.x += p.vx*dt; p.y += p.vy*dt; p.life -= dt;
                if(p.life <= 0) { p.el.remove(); particles.splice(i,1); }
                else { p.el.setAttribute('cx', p.x); p.el.setAttribute('cy', p.y); p.el.setAttribute('opacity', p.life/p.maxLife); }
            }
        }

        function updateCooldowns() {
            const now = performance.now() / 1000;
            db.weapons.forEach(wKey => {
                const btn = document.getElementById(`cd-${wKey}`);
                if (!btn) return;
                const cdTime = gameState.cooldowns[wKey];
                if (now < cdTime) {
                    const w = WEAPON_CONFIG[wKey];
                    const lv = db.w_levels[wKey];
                    const maxCd = Math.max(0, w.baseCd - w.cdReduction*(lv-1));
                    const remaining = cdTime - now;
                    const pct = (remaining / maxCd) * 100;
                    btn.style.height = `${pct}%`;
                    const t = btn.querySelector('.cd-text');
                    t.classList.remove('hidden'); t.textContent = remaining.toFixed(1);
                } else {
                    btn.style.height = '0%';
                    btn.querySelector('.cd-text').classList.add('hidden');
                }
            });
        }

        function updateTargetHp() {
            document.getElementById('hp-bar').style.width = Math.max(0, gameState.targetHp) + '%';
            if (pvpState.active) {
                document.getElementById('pvp-my-hp').style.width = Math.max(0, gameState.targetHp) + '%';
                sendPvpMsg({ type: 'hp_sync', hp: gameState.targetHp });
            }
        }

        // ==========================================
        // Interaction & Drag & Throw Physics
        // ==========================================
        function getWeaponStats() {
            const w = WEAPON_CONFIG[gameState.weapon];
            const lv = db.w_levels[gameState.weapon];
            return {
                dmg: w.baseDmg + (lv-1),
                rad: w.baseRadius,
                cd: Math.max(0, w.baseCd - w.cdReduction*(lv-1))
            };
        }

        function showWeaponVisual(x,y) {
            const ws = document.getElementById('weapon-slipper');
            let content = '', a=-30;
            if(gameState.weapon=='slipper') content=`<svg viewBox="0 0 100 100" class="w-full h-full"><path d="M 30 70 C 25 50, 30 20, 50 15 C 70 20, 75 50, 70 70 C 65 85, 50 90, 50 90 Z" fill="#3b82f6" stroke="#1d4ed8" stroke-width="3"/></svg>`;
            if(gameState.weapon=='grandma_slipper') content=`<svg viewBox="0 0 100 100" class="w-full h-full scale-125"><path d="M 30 70 C 25 50, 30 20, 50 15 C 70 20, 75 50, 70 70 C 65 85, 50 90, 50 90 Z" fill="#ef4444" stroke="#b91c1c" stroke-width="3"/></svg>`;
            if(gameState.weapon=='newspaper'){ content=`<svg viewBox="0 0 100 100" class="w-full h-full rotate-12"><rect x="35" y="10" width="30" height="80" rx="4" fill="#e5e7eb" stroke="#9ca3af" stroke-width="2"/></svg>`; a=-45; }
            if(gameState.weapon=='pesticide_bomb'){ content=`<svg viewBox="0 0 100 100" class="w-full h-full scale-110"><rect x="35" y="30" width="30" height="55" rx="8" fill="#10b981" stroke="#047857" stroke-width="3"/></svg>`; a=15; }
            if(gameState.weapon=='gold_slipper') content=`<svg viewBox="0 0 100 100" class="w-full h-full scale-125 drop-shadow-[0_0_15px_rgba(251,191,36,0.9)]"><path d="M 30 70 C 25 50, 30 20, 50 15 C 70 20, 75 50, 70 70 C 65 85, 50 90, 50 90 Z" fill="url(#gold-grad)" stroke="#d97706" stroke-width="3"/></svg>`;
            ws.innerHTML=content; ws.style.left=`${x-48}px`; ws.style.top=`${y-48}px`; ws.style.transform=`scale(1.2) rotate(${a}deg)`; ws.style.opacity='1';
            setTimeout(()=>{ws.style.transform=`scale(0.8) rotate(0deg)`;}, 60); setTimeout(()=>{ws.style.opacity='0';}, 250);
        }

        function triggerShake() { const c=document.getElementById('game-container'); c.classList.remove('shake-effect'); void c.offsetWidth; c.classList.add('shake-effect'); }
        function spawnSplat(x,y,r) { const e = document.createElementNS("http://www.w3.org/2000/svg","circle"); e.setAttribute('cx',x); e.setAttribute('cy',y); e.setAttribute('r',r); e.setAttribute('fill','url(#splat-grad)'); document.getElementById('effects-layer').appendChild(e); setTimeout(()=>e.remove(), 1000); }
        function spawnPoison(x,y,r) { const e = document.createElementNS("http://www.w3.org/2000/svg","circle"); e.setAttribute('cx',x); e.setAttribute('cy',y); e.setAttribute('r',r); e.setAttribute('fill','url(#poison-grad)'); document.getElementById('effects-layer').appendChild(e); setTimeout(()=>e.remove(), 1500); }
        
        function spawnParticle(x,y, color, count=5) {
            for(let i=0;i<count;i++){
                const el = document.createElementNS("http://www.w3.org/2000/svg","circle");
                el.setAttribute('r', Math.random()*2+1); el.setAttribute('fill', color);
                document.getElementById('effects-layer').appendChild(el);
                particles.push({el: el, x:x, y:y, vx:(Math.random()-0.5)*200, vy:(Math.random()-0.5)*200, life:0.5, maxLife:0.5});
            }
        }

        function showDamageText(x, y, text, color="text-white") {
            const d = document.createElement('div');
            d.className = `damage-text text-xl font-black ${color} drop-shadow-md font-mono`;
            d.style.left = `${x}px`; d.style.top = `${y}px`;
            d.textContent = text;
            document.body.appendChild(d);
            setTimeout(() => d.remove(), 800);
        }

        function triggerCombo() {
            const now = performance.now();
            if (now - gameState.lastKillTime < 1500) {
                gameState.combo++;
                const cDiv = document.getElementById('combo-count');
                cDiv.textContent = gameState.combo;
                const d = document.getElementById('combo-display');
                d.classList.remove('combo-text'); void d.offsetWidth; d.classList.add('combo-text');
                playSound.combo(gameState.combo);
            } else {
                gameState.combo = 1;
            }
            gameState.lastKillTime = now;
        }

        function handleInteract(x, y) {
            if(!gameState.active) return;
            if(gameState.mode === 'sandbox') {
                if(gameState.tool === 'food') {
                    const f = document.createElementNS("http://www.w3.org/2000/svg","circle");
                    f.setAttribute('cx',x); f.setAttribute('cy',y); f.setAttribute('r',8); f.setAttribute('fill','#fcd34d');
                    document.getElementById('food-layer').appendChild(f);
                    foods.push({x:x, y:y, hp:100, element:f});
                } else {
                    // 生態觀察箱中放小強
                    roaches.push(new Cockroach(x, y, true));
                }
                return;
            }

            const now = performance.now() / 1000;
            if (now < gameState.cooldowns[gameState.weapon]) return;

            const stats = getWeaponStats();
            gameState.cooldowns[gameState.weapon] = now + stats.cd;
            
            showWeaponVisual(x, y);

            if(gameState.weapon === 'newspaper') playSound.swish();
            else if(gameState.weapon === 'pesticide_bomb') { playSound.explosion(); spawnPoison(x,y,stats.rad); triggerShake(); }
            else { triggerShake(); }

            let hitSomething = false;
            let killed = 0;

            for (let i = roaches.length - 1; i >= 0; i--) {
                const r = roaches[i];
                if (Math.hypot(r.x - x, r.y - y) <= stats.rad) {
                    hitSomething = true;
                    
                    if (r.type === 'ninja' && Math.random() < 0.3 && gameState.weapon !== 'pesticide_bomb') {
                        showDamageText(r.x, r.y, 'Miss!', 'text-purple-400');
                        continue;
                    }

                    r.hp -= stats.dmg;
                    spawnParticle(r.x, r.y, r.type==='golden'?'#fef08a':'#4ade80', r.type==='tank'?3:5);
                    
                    if (r.hp > 0) {
                        playSound.armorHit();
                        showDamageText(r.x, r.y, `-${stats.dmg}`, 'text-gray-400');
                        r.x -= r.vx * 0.1; r.y -= r.vy * 0.1;
                    } else {
                        playSound.splat();
                        triggerCombo();
                        killed++;
                        
                        let baseScore = 10, baseCoin = 1, baseExp = 5;
                        if(r.type==='tank'){ baseScore=30; baseCoin=2; baseExp=15; }
                        else if(r.type==='golden'){ baseScore=50; baseCoin=5; baseExp=25; playSound.coin(); }
                        else if(r.type==='ninja'){ baseScore=40; baseCoin=3; baseExp=20; }
                        
                        if(gameState.isNight) { baseCoin=Math.floor(baseCoin*1.5); baseExp=Math.floor(baseExp*1.5); }
                        
                        const comboMult = 1 + (gameState.combo * 0.1);
                        const finalScore = Math.floor(baseScore * comboMult);
                        const finalCoin = Math.floor(baseCoin * comboMult);
                        const finalExp = Math.floor(baseExp * comboMult);

                        gameState.score += finalScore;
                        gameState.sessionCoins += finalCoin;
                        db.coins += finalCoin;
                        if(pvpState.active) { pvpState.pvpCoins += finalCoin; updatePvpCoinsUI(); }
                        db.kills[r.type]++;
                        addExp(finalExp);

                        document.getElementById('score').textContent = gameState.score;
                        document.getElementById('session-coins').textContent = gameState.sessionCoins;
                        showDamageText(r.x, r.y, `+${finalScore}`, 'text-yellow-400');

                        const c = document.createElementNS("http://www.w3.org/2000/svg", "ellipse");
                        c.setAttribute('cx', r.x); c.setAttribute('cy', r.y); c.setAttribute('rx', 12*r.size); c.setAttribute('ry', 18*r.size);
                        c.setAttribute('fill', r.type==='golden'?'#ca8a04':'#14532d'); c.setAttribute('opacity', 0.5); c.setAttribute('transform', r.element.getAttribute('transform'));
                        document.getElementById('corpses-layer').appendChild(c);
                        corpses.push(c); if(corpses.length>30){ corpses[0].remove(); corpses.shift(); }
                        
                        spawnSplat(r.x, r.y, r.size*15);
                        r.element.remove();
                        roaches.splice(i, 1);
                    }
                }
            }
            if(!hitSomething && gameState.weapon === 'slipper') playSound.damage();
        }

        // ==========================================
        // Unified Touch & Drag Handlers
        // ==========================================
        function getPos(e) {
            const rect = svg.getBoundingClientRect();
            let cX = e.clientX, cY = e.clientY;
            if (e.touches && e.touches.length > 0) {
                cX = e.touches[0].clientX;
                cY = e.touches[0].clientY;
            }
            return { x: cX - rect.left, y: cY - rect.top, rawX: cX, rawY: cY };
        }

        svg.addEventListener('mousedown', (e) => {
            const pos = getPos(e);
            isSwiping = true;

            if (gameState.active && gameState.mode === 'sandbox') {
                let hit = null;
                for (let r of roaches) {
                    if (Math.hypot(r.x - pos.x, r.y - pos.y) < 35 * r.size) { hit = r; break; }
                }
                if (hit) {
                    draggedRoach = hit;
                    draggedRoach.isDragged = true;
                    lastDragPos = { x: pos.x, y: pos.y };
                    dragVelocity = { x: 0, y: 0 };
                    return;
                }
            }
            handleInteract(pos.rawX, pos.rawY);
        });

        svg.addEventListener('mousemove', (e) => {
            const pos = getPos(e);
            
            if (draggedRoach && gameState.mode === 'sandbox') {
                dragVelocity.x = pos.x - lastDragPos.x;
                dragVelocity.y = pos.y - lastDragPos.y;
                draggedRoach.x = pos.x;
                draggedRoach.y = pos.y;
                lastDragPos = { x: pos.x, y: pos.y };

                // 掙扎wriggle動畫旋轉
                const wriggle = Math.sin(performance.now() / 20) * 25;
                draggedRoach.element.setAttribute('transform', `translate(${draggedRoach.x}, ${draggedRoach.y}) rotate(${wriggle})`);
                return;
            }

            if (isSwiping && gameState.weapon === 'newspaper') {
                handleInteract(pos.rawX, pos.rawY);
            }
        });

        window.addEventListener('mouseup', () => {
            isSwiping = false;
            if (draggedRoach && gameState.mode === 'sandbox') {
                draggedRoach.isDragged = false;
                draggedRoach.vx = dragVelocity.x * 20;
                draggedRoach.vy = dragVelocity.y * 20;
                draggedRoach = null;
            }
        });

        svg.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const pos = getPos(e);
            isSwiping = true;

            if (gameState.active && gameState.mode === 'sandbox') {
                let hit = null;
                for (let r of roaches) {
                    if (Math.hypot(r.x - pos.x, r.y - pos.y) < 35 * r.size) { hit = r; break; }
                }
                if (hit) {
                    draggedRoach = hit;
                    draggedRoach.isDragged = true;
                    lastDragPos = { x: pos.x, y: pos.y };
                    dragVelocity = { x: 0, y: 0 };
                    return;
                }
            }
            handleInteract(pos.rawX, pos.rawY);
        }, { passive: false });

        svg.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const pos = getPos(e);

            if (draggedRoach && gameState.mode === 'sandbox') {
                dragVelocity.x = pos.x - lastDragPos.x;
                dragVelocity.y = pos.y - lastDragPos.y;
                draggedRoach.x = pos.x;
                draggedRoach.y = pos.y;
                lastDragPos = { x: pos.x, y: pos.y };

                const wriggle = Math.sin(performance.now() / 20) * 25;
                draggedRoach.element.setAttribute('transform', `translate(${draggedRoach.x}, ${draggedRoach.y}) rotate(${wriggle})`);
                return;
            }

            if (isSwiping && gameState.weapon === 'newspaper') {
                handleInteract(pos.rawX, pos.rawY);
            }
        }, { passive: false });

        window.addEventListener('touchend', () => {
            isSwiping = false;
            if (draggedRoach && gameState.mode === 'sandbox') {
                draggedRoach.isDragged = false;
                draggedRoach.vx = dragVelocity.x * 20;
                draggedRoach.vy = dragVelocity.y * 20;
                draggedRoach = null;
            }
        });

        // ==========================================
        // End Game Logic
        // ==========================================
        function triggerGameOver() {
            gameState.active = false;
            cancelAnimationFrame(animationId);
            playSound.damage();
            
            document.getElementById('go-title').innerHTML = '<i class="fa-solid fa-skull-crossbones mr-2"></i>防線崩潰';
            document.getElementById('go-title').className = 'text-3xl font-black text-red-500 mb-2 relative z-10';
            document.getElementById('go-bg-glow').className = 'absolute top-0 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-48 h-48 bg-red-600/30 blur-[50px] rounded-full';
            
            document.getElementById('final-score').textContent = gameState.score;
            document.getElementById('final-coins').textContent = gameState.sessionCoins;
            document.getElementById('final-exp').textContent = `+${Math.floor(gameState.score/2)}`;
            saveDb();
            document.getElementById('game-over-screen').classList.remove('hidden');
        }

        function triggerPvPLose() {
            gameState.active = false;
            cancelAnimationFrame(animationId);
            playSound.damage();
            sendPvpMsg({ type: 'game_over_lose', sender: pvpState.myPlayerId });
            
            document.getElementById('go-title').innerHTML = '<i class="fa-solid fa-face-sad-cry mr-2"></i>你輸了！';
            document.getElementById('go-title').className = 'text-3xl font-black text-red-500 mb-2 relative z-10';
            document.getElementById('go-subtitle').textContent = '你的蛋糕先被吃光了。';
            
            document.getElementById('final-score').textContent = gameState.score;
            document.getElementById('final-coins').textContent = gameState.sessionCoins;
            document.getElementById('final-exp').textContent = '+10';
            saveDb();
            document.getElementById('game-over-screen').classList.remove('hidden');
        }

        function triggerPvPWin() {
            gameState.active = false;
            cancelAnimationFrame(animationId);
            playSound.levelup();
            
            document.getElementById('go-title').innerHTML = '<i class="fa-solid fa-trophy mr-2"></i>勝利！';
            document.getElementById('go-title').className = 'text-3xl font-black text-yellow-400 mb-2 relative z-10';
            document.getElementById('go-subtitle').textContent = '你成功守護了陣地！獎勵 100 金幣';
            document.getElementById('go-bg-glow').className = 'absolute top-0 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-48 h-48 bg-yellow-500/30 blur-[50px] rounded-full';
            
            db.coins += 100;
            gameState.sessionCoins += 100;
            document.getElementById('final-score').textContent = gameState.score;
            document.getElementById('final-coins').textContent = gameState.sessionCoins;
            document.getElementById('final-exp').textContent = '+50';
            addExp(50);
            saveDb();
            document.getElementById('game-over-screen').classList.remove('hidden');
        }

        function returnToLobby() {
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('game-container').classList.add('hidden');
            document.getElementById('lobby-screen').classList.remove('hidden');
            updateLobbyUI();
            
            if(pvpState.active && mqttClient) {
                try { mqttClient.end(); } catch(e){}
                pvpState.active = false;
                pvpState.roomCode = '';
                pvpState.opponentId = null;
            }
        }

        // Init
        updateLobbyUI();
        initLobbyAnim();
        requestAnimationFrame(drawLobby);

    </script>
</body>
</html>
